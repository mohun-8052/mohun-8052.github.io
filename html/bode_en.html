<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Bode+根轨迹</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/9.4.4/math.js"></script>
    <style>
        :root { --bg: #f5f7f9; --panel: #ffffff; --primary: #1976D2; --axis: #333; --grid: #e8e8e8; --probe: #9C27B0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        #sidebar { width: 360px; min-width: 360px; background: var(--panel); border-right: 1px solid #cfd8dc; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 12px rgba(0,0,0,0.08); }
        .section { padding: 12px; border: 1px solid #e0e6ed; border-radius: 8px; background: #fff; }
        h3 { font-size: 0.85rem; margin: 0 0 10px 0; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 8px; text-transform: uppercase; }
        label { display: block; font-size: 11px; color: #546e7a; margin-bottom: 2px; font-weight: 700; }
        input, select { width: 100%; padding: 5px; border: 1px solid #b0bec5; border-radius: 4px; box-sizing: border-box; font-family: 'Consolas', monospace; margin-bottom: 5px; font-size: 12px; }
        #main { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; background: #eceff1; overflow-y: auto; align-items: center; }
        .chart-container { width: 100%; max-width: 1100px; background: #fff; border: 1px solid #cfd8dc; border-radius: 4px; position: relative; }
        canvas { display: block; width: 100%; height: 320px; cursor: crosshair; }
        .tag { position: absolute; top: 10px; left: 85px; font-size: 10px; font-weight: 800; color: #fff; background: #455a64; padding: 2px 6px; border-radius: 3px; z-index: 5; }
        #dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; background: #263238; color: #fff; border-radius: 8px; }
        .val { color: #64ffda; font-weight: 800; display: block; font-size: 18px; }
        .probe-val { color: #E1BEE7; font-size: 12px; margin-top: 4px; border-top: 1px solid #546e7a; padding-top: 4px; grid-column: span 2; }
        .item-row { display: grid; grid-template-columns: 1fr 85px 45px 25px 20px; gap: 4px; margin-bottom: 8px; align-items: center; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .q-input { grid-column: 1 / span 2; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 11px; }
        input[type="color"] { padding: 0; height: 24px; border: none; cursor: pointer; background: none; }
        .rl-control { display: flex; align-items: center; gap: 8px; }
        .rl-control input[type="range"] { flex: 1; }
        .rl-control span { font-weight: bold; min-width: 40px; text-align: center; }
        .checkbox-group { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
        .checkbox-group input[type="checkbox"] { margin: 0; flex-shrink: 0; width: 14px; height: 14px; cursor: pointer; }
        .checkbox-group label { margin: 0; font-weight: 400; font-size: 12px; color: #333; white-space: nowrap; user-select: none; cursor: pointer; }
        /* 恢复删除按钮原始样式（保留在内联中，此处不需要额外定义） */
    </style>
</head>
<body>

<div id="sidebar">
    <div id="dashboard">
        <div>UGF<span id="ugf-val" class="val">--</span></div>
        <div>PM<span id="pm-val" class="val">--</span></div>
        <div id="probe-readout" class="probe-val">Probe: 拖动紫色虚线查看数据</div>
    </div>

    <div class="section">
        <h3>1. 系统参数</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div>
                <label>Gain (dB)</label>
                <input type="text" id="dc-gain" value="60" onchange="updateSys()">
            </div>
            <div>
                <label>Phase Start (°)</label>
                <input type="number" id="phase-start" value="180" onchange="render()">
            </div>
        </div>
        <label>极点 / 零点</label>
        <div id="poles-list"></div>
        <button class="btn-add" onclick="addItem('pole')">+ 增加极点</button>
        <div id="zeros-list" style="margin-top:10px;"></div>
        <button class="btn-add" onclick="addItem('zero')">+ 增加零点</button>
        <div style="margin-top:4px; font-size:10px; color:#78909c;">根轨迹仅支持 ≤3 阶</div>
    </div>

    <div class="section">
        <h3>2. 视图与量程</h3>
        <label>中心频率 & 跨度 (Log)</label>
        <input type="range" id="freq-pan" min="-6" max="12" step="0.1" value="4" oninput="updateView()">
        <input type="range" id="freq-zoom" min="1" max="18" step="0.1" value="8" oninput="updateView()">
        <label>纵轴范围</label>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:4px;">
            <input type="number" id="mag-min" value="-40" onchange="render()">
            <input type="number" id="mag-max" value="80" onchange="render()">
            <input type="number" id="phase-min" value="-90" onchange="render()">
            <input type="number" id="phase-max" value="270" onchange="render()">
        </div>
    </div>

    <div class="section">
        <h3>3. 根轨迹</h3>
        <label>反馈系数 β 上限</label>
        <input type="number" id="beta-max" value="1" step="0.1" onchange="updateBetaMax()">
        <label>β 值</label>
        <div class="rl-control">
            <input type="range" id="beta-slider" min="0" max="1" step="0.01" value="1" oninput="updateBeta()">
            <span id="beta-display">1.00</span>
        </div>
        <div style="margin-top:4px; font-size:11px; color:#78909c;">拖动滑块，闭环极点（红点）沿轨迹移动</div>
        <div class="checkbox-group">
            <input type="checkbox" id="show-coords" onchange="render()">
            <label for="show-coords">显示坐标</label>
        </div>
    </div>
</div>

<div id="main">
    <div class="chart-container">
        <div class="tag">MAGNITUDE (dB)</div>
        <canvas id="magCanvas"></canvas>
    </div>
    <div class="chart-container">
        <div class="tag">PHASE (Degree)</div>
        <canvas id="phaseCanvas"></canvas>
    </div>
    <div class="chart-container">
        <div class="tag">ROOT LOCUS</div>
        <canvas id="rlCanvas"></canvas>
    </div>
</div>

<script>
    // ===================================================================
    // 常量 & 状态
    // ===================================================================
    const EPS = 1e-12;
    const UNITS = { 'G': 1e9, 'M': 1e6, 'k': 1e3, 'm': 1e-3, 'u': 1e-6, 'n': 1e-9, 'p': 1e-12 };
    const PAD = { t: 40, r: 40, b: 50, l: 85 };
    const COLORS = { axis: '#333', grid: '#e8e8e8', ugf: '#D32F2F', probe: '#9C27B0' };

    let sys = {
        dc: 60,
        poles: [{f: 1000, t: 'LHP', c: '#D32F2F', q: 0.707}],
        zeros: [{f: 1e6, t: 'LHP', c: '#2E7D32'}],
        probeFreq: 1e5
    };
    let view = { fMin: 1, fMax: 1e9 };
    let currentBeta = 1.0;
    let betaMax = 1;

    const mCanvas = document.getElementById('magCanvas');
    const pCanvas = document.getElementById('phaseCanvas');
    const rlCanvas = document.getElementById('rlCanvas');
    const mCtx = mCanvas.getContext('2d');
    const pCtx = pCanvas.getContext('2d');
    const rlCtx = rlCanvas.getContext('2d');

    // ===================================================================
    // 工具函数
    // ===================================================================
    function freqToX(f, w) {
        const logMin = Math.log10(view.fMin), logMax = Math.log10(view.fMax);
        return PAD.l + (Math.log10(f) - logMin) / (logMax - logMin) * (w - PAD.l - PAD.r);
    }
    function xToFreq(x, w) {
        const logMin = Math.log10(view.fMin), logMax = Math.log10(view.fMax);
        return Math.pow(10, logMin + (x - PAD.l) / (w - PAD.l - PAD.r) * (logMax - logMin));
    }
    function valToY(v, min, max, h) {
        return h - PAD.b - (v - min) / (max - min) * (h - PAD.t - PAD.b);
    }
    function formatEng(v) {
        const a = Math.abs(v);
        if (a >= 1e9) return (v/1e9).toFixed(1) + 'G';
        if (a >= 1e6) return (v/1e6).toFixed(1) + 'M';
        if (a >= 1e3) return (v/1e3).toFixed(1) + 'k';
        if (a >= 1) return v.toFixed(a<10?1:0);
        if (a >= 1e-3) return (v*1e3).toFixed(0) + 'm';
        if (a >= 1e-6) return (v*1e6).toFixed(0) + 'u';
        return v.toExponential(0);
    }
    function parseEng(s) {
        const m = String(s).match(/^([0-9.]+)\s*([a-zA-Z]*)$/);
        return m ? parseFloat(m[1]) * (UNITS[m[2]] || 1) : parseFloat(s) || 0;
    }
    function toSci(val) {
        if (val === 0) return '0';
        const abs = Math.abs(val), exp = Math.floor(Math.log10(abs));
        const mant = abs / Math.pow(10, exp);
        return (val < 0 ? '-' : '') + mant.toPrecision(3) + 'E' + exp;
    }

    // ===================================================================
    // Bode 计算 & 绘图
    // ===================================================================
    function getResp(f) {
        let m = sys.dc;
        let p = parseFloat(document.getElementById('phase-start').value) || 0;
        const process = (item, isP) => {
            const s = isP ? -1 : 1;
            if (item.t === 'Conjugate') {
                const r = f / item.f;
                m += s * 20 * Math.log10(Math.sqrt(Math.pow(1 - r*r, 2) + Math.pow(r/item.q, 2)) || 1e-15);
                p += s * Math.atan2(r/item.q, 1 - r*r) * 180 / Math.PI;
            } else {
                m += s * 20 * Math.log10(Math.sqrt(1 + (f/item.f)**2));
                const d = Math.atan2(f, item.f) * 180 / Math.PI;
                p += s * (item.t === 'LHP' ? d : -d);
            }
        };
        sys.poles.forEach(x => process(x, true));
        sys.zeros.forEach(x => process(x, false));
        return { m, p };
    }

    function drawGrid(ctx, w, h, range, unit) {
        ctx.strokeStyle = COLORS.grid; ctx.lineWidth = 1;
        const lMin = Math.floor(Math.log10(view.fMin)), lMax = Math.ceil(Math.log10(view.fMax));
        for (let i = lMin; i <= lMax; i++) {
            const x = freqToX(Math.pow(10, i), w);
            if (x < PAD.l || x > w - PAD.r) continue;
            ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, h - PAD.b); ctx.stroke();
        }
        ctx.strokeStyle = COLORS.axis; ctx.lineWidth = 2;
        ctx.strokeRect(PAD.l, PAD.t, w - PAD.l - PAD.r, h - PAD.t - PAD.b);
        ctx.fillStyle = COLORS.axis; ctx.font = "bold 11px Consolas";
        for (let i = lMin; i <= lMax; i++) {
            const f = Math.pow(10, i);
            const x = freqToX(f, w);
            if (x >= PAD.l - 10 && x <= w - PAD.r + 10) ctx.fillText(formatEng(f), x - 18, h - PAD.b + 22);
        }
        for (let i = 0; i <= 6; i++) {
            const val = range.min + (range.max - range.min) * (i / 6);
            const y = valToY(val, range.min, range.max, h);
            ctx.fillText(val.toFixed(0) + unit, PAD.l - 65, y + 4);
        }
        // 参考线
        if (unit === 'dB') {
            if (range.min < 0 && range.max > 0) {
                const y0 = valToY(0, range.min, range.max, h);
                ctx.save();
                ctx.strokeStyle = '#D32F2F'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
                ctx.beginPath(); ctx.moveTo(PAD.l, y0); ctx.lineTo(w - PAD.r, y0); ctx.stroke();
                ctx.restore();
            }
        } else {
            if (range.min < 0 && range.max > 0) {
                const y0 = valToY(0, range.min, range.max, h);
                ctx.save();
                ctx.strokeStyle = '#1976D2'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
                ctx.beginPath(); ctx.moveTo(PAD.l, y0); ctx.lineTo(w - PAD.r, y0); ctx.stroke();
                ctx.restore();
            }
            if (range.min < -180 && range.max > -180) {
                const y180 = valToY(-180, range.min, range.max, h);
                ctx.save();
                ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 0.8; ctx.setLineDash([4,4]);
                ctx.beginPath(); ctx.moveTo(PAD.l, y180); ctx.lineTo(w - PAD.r, y180); ctx.stroke();
                ctx.restore();
            }
        }
    }

    function drawMarker(ctx, item, isP, range, w, h) {
        if (item.f < view.fMin || item.f > view.fMax) return;
        const x = freqToX(item.f, w), y = valToY(getResp(item.f).m, range.min, range.max, h);
        ctx.strokeStyle = item.c; ctx.lineWidth = 3;
        ctx.beginPath();
        if (isP) {
            const s = 6;
            ctx.moveTo(x-s, y-s); ctx.lineTo(x+s, y+s);
            ctx.moveTo(x-s, y+s); ctx.lineTo(x+s, y-s);
            if (item.t === 'Conjugate') ctx.strokeRect(x-8, y-8, 16, 16);
        } else {
            ctx.arc(x, y, 5, 0, 2*Math.PI);
        }
        ctx.stroke();
    }

    function drawProbe(w, h, mRange, pRange) {
        if (sys.probeFreq < view.fMin || sys.probeFreq > view.fMax) return;
        const px = freqToX(sys.probeFreq, w);
        const res = getResp(sys.probeFreq);
        const my = valToY(res.m, mRange.min, mRange.max, h);
        const py = valToY(res.p, pRange.min, pRange.max, h);
        [mCtx, pCtx].forEach(ctx => {
            ctx.save();
            ctx.setLineDash([6,4]);
            ctx.strokeStyle = COLORS.probe; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(px, PAD.t); ctx.lineTo(px, h - PAD.b); ctx.stroke();
            const targetY = (ctx === mCtx) ? my : py;
            ctx.setLineDash([]);
            ctx.fillStyle = COLORS.probe;
            ctx.beginPath(); ctx.arc(px, targetY, 4, 0, 2*Math.PI); ctx.fill();
            ctx.font = "bold 11px Arial";
            ctx.fillText((ctx===mCtx)?`${res.m.toFixed(1)} dB`:`${res.p.toFixed(1)}°`, px+8, targetY-8);
            if(ctx===mCtx) ctx.fillText(`f: ${formatEng(sys.probeFreq)}Hz`, px+8, PAD.t+15);
            ctx.restore();
        });
        document.getElementById('probe-readout').innerHTML =
            `Probe @ <b>${formatEng(sys.probeFreq)}Hz</b>: <span style="color:#64ffda">${res.m.toFixed(2)}dB</span> / <span style="color:#ffb74d">${res.p.toFixed(1)}°</span>`;
    }

    // ===================================================================
    // 根轨迹核心 (解析 ≤3 阶)
    // ===================================================================
    function getOpenLoopRoots() {
        const poles = [];
        sys.poles.forEach(p => {
            const f = p.f;
            if (p.t === 'Conjugate') {
                const wn = 2 * Math.PI * f, zeta = 1 / (2 * (p.q || 0.707));
                const real = -zeta * wn, imag = wn * Math.sqrt(1 - zeta*zeta);
                poles.push(math.complex(real, imag), math.complex(real, -imag));
            } else {
                const s = (p.t === 'LHP') ? -2*Math.PI*f : 2*Math.PI*f;
                poles.push(math.complex(s, 0));
            }
        });
        const zeros = [];
        sys.zeros.forEach(z => {
            const f = z.f, s = (z.t === 'LHP') ? -2*Math.PI*f : 2*Math.PI*f;
            zeros.push(math.complex(s, 0));
        });
        return { poles, zeros };
    }

    function buildPolynomial(roots) {
        let poly = [math.complex(1, 0)];
        roots.forEach(r => {
            const newPoly = new Array(poly.length + 1).fill(math.complex(0, 0));
            for (let i = 0; i < poly.length; i++) {
                newPoly[i] = math.add(newPoly[i], poly[i]);
                newPoly[i+1] = math.subtract(newPoly[i+1], math.multiply(poly[i], r));
            }
            poly = newPoly;
        });
        return poly.map(c => {
            const re = math.re(c);
            // 消除虚部残留
            return math.abs(math.im(c)) < EPS ? re : re;
        });
    }

    function computeGain() {
        const { poles, zeros } = getOpenLoopRoots();
        if (poles.length === 0 && zeros.length === 0) return 1;
        const Dpoly = buildPolynomial(poles);
        const Npoly = buildPolynomial(zeros);
        const dcLinear = Math.pow(10, sys.dc / 20);
        const D0 = Dpoly[Dpoly.length-1] || 1, N0 = Npoly[Npoly.length-1] || 1;
        let K = dcLinear * D0 / N0;
        return (isFinite(K) && !isNaN(K)) ? K : 1;
    }

    function quadraticRoots(a, b, c) {
        if (Math.abs(a) < EPS) {
            if (Math.abs(b) < EPS) return [];
            return [math.complex(-c/b, 0)];
        }
        const disc = b*b - 4*a*c;
        if (disc >= 0) {
            const sqrtD = Math.sqrt(disc);
            return [math.complex((-b + sqrtD)/(2*a), 0), math.complex((-b - sqrtD)/(2*a), 0)];
        } else {
            const sqrtD = math.sqrt(math.complex(disc, 0));
            return [
                math.divide(math.add(math.complex(-b, 0), sqrtD), 2*a),
                math.divide(math.subtract(math.complex(-b, 0), sqrtD), 2*a)
            ];
        }
    }

    function cubicRoots(a, b, c, d) {
        if (Math.abs(a) < EPS) return quadraticRoots(b, c, d);
        const p = (3*a*c - b*b) / (3*a*a);
        const q = (2*b*b*b - 9*a*b*c + 27*a*a*d) / (27*a*a*a);
        const disc = (q/2)*(q/2) + (p/3)*(p/3)*(p/3);
        let roots = [];
        if (disc >= 0) {
            const sqrtD = Math.sqrt(disc);
            const u = Math.cbrt(-q/2 + sqrtD), v = Math.cbrt(-q/2 - sqrtD);
            roots.push(math.complex(u + v - b/(3*a), 0));
            const realPart = -(u+v)/2 - b/(3*a);
            const imagPart = (Math.sqrt(3)/2)*(u - v);
            if (Math.abs(imagPart) > EPS) {
                roots.push(math.complex(realPart, imagPart), math.complex(realPart, -imagPart));
            } else {
                roots.push(math.complex(realPart, 0), math.complex(realPart, 0));
            }
        } else {
            const r = 2 * Math.sqrt(-p/3);
            const theta = Math.acos((3*q/(2*p)) * Math.sqrt(-3/p)) / 3;
            for (let k = 0; k < 3; k++) {
                roots.push(math.complex(r * Math.cos(theta - 2*Math.PI*k/3) - b/(3*a), 0));
            }
        }
        return roots;
    }

    function computeClosedLoopRoots(beta) {
        const { poles, zeros } = getOpenLoopRoots();
        if (poles.length === 0) return [];
        const K = computeGain();
        const Dpoly = buildPolynomial(poles);
        const Npoly = buildPolynomial(zeros);
        const degD = Dpoly.length - 1, degN = Npoly.length - 1;
        const degMax = Math.max(degD, degN);
        const coeffs = [];
        for (let d = degMax; d >= 0; d--) {
            let cD = 0, cN = 0;
            if (d <= degD) cD = Dpoly[degD - d];
            if (d <= degN) cN = Npoly[degN - d];
            coeffs.push(cD + beta * K * cN);
        }
        while (coeffs.length > 1 && Math.abs(coeffs[0]) < EPS) coeffs.shift();
        if (coeffs.length === 1) return [];

        const order = coeffs.length - 1;
        if (order > 3) return [];

        if (order === 1) {
            const a = coeffs[0], b = coeffs[1];
            if (Math.abs(a) < EPS) return [];
            return [math.complex(-b/a, 0)];
        }
        if (order === 2) return quadraticRoots(coeffs[0], coeffs[1], coeffs[2]);
        if (order === 3) return cubicRoots(coeffs[0], coeffs[1], coeffs[2], coeffs[3]);
        return [];
    }

    // ===================================================================
    // 根轨迹绘制
    // ===================================================================
    function drawRootLocus() {
        const dpr = window.devicePixelRatio || 1;
        const canvas = rlCanvas;
        const w = canvas.width / dpr, h = canvas.height / dpr;
        const ctx = rlCtx;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const beta = currentBeta;
        const betaMaxVal = parseFloat(document.getElementById('beta-max').value) || 1;
        const showCoords = document.getElementById('show-coords').checked;

        const { poles, zeros } = getOpenLoopRoots();
        if (poles.length > 3) {
            ctx.fillStyle = '#e53935';
            ctx.font = "bold 16px Arial";
            ctx.textAlign = 'center';
            ctx.fillText('系统阶数 > 3，无法绘制根轨迹', w/2, h/2);
            return;
        }

        // 无穷远阈值
        let maxReal = 0;
        [...poles, ...zeros].forEach(p => { const re = Math.abs(math.re(p)); if (re > maxReal) maxReal = re; });
        const INF_THRESHOLD = maxReal * 100;
        const hasThreshold = maxReal > 0;

        // 生成散点
        const numSteps = 80;
        const allPoints = [];
        for (let i = 0; i <= numSteps; i++) {
            const b = (i / numSteps) * betaMaxVal;
            const roots = computeClosedLoopRoots(b);
            roots.forEach(r => {
                const re = math.re(r);
                if (!hasThreshold || Math.abs(re) <= INF_THRESHOLD) {
                    allPoints.push({ real: re, imag: math.im(r) });
                }
            });
        }

        // 当前闭环极点 (过滤)
        let currentRoots = computeClosedLoopRoots(beta);
        let hasInfinite = false;
        const validCurrent = [];
        currentRoots.forEach(r => {
            const re = math.re(r);
            if (hasThreshold && Math.abs(re) > INF_THRESHOLD) hasInfinite = true;
            else validCurrent.push(r);
        });
        currentRoots = validCurrent;

        // 收集所有坐标点用于缩放
        let allCoords = allPoints.map(p => ({ real: p.real, imag: p.imag }));
        poles.forEach(p => allCoords.push({ real: math.re(p), imag: math.im(p) }));
        zeros.forEach(z => allCoords.push({ real: math.re(z), imag: math.im(z) }));
        currentRoots.forEach(r => allCoords.push({ real: math.re(r), imag: math.im(r) }));

        if (allCoords.length === 0) {
            ctx.fillStyle = '#999';
            ctx.font = "16px Arial";
            ctx.textAlign = 'center';
            ctx.fillText('无零极点或求解失败', w/2, h/2);
            return;
        }

        // 计算坐标范围
        let realMin = Infinity, realMax = -Infinity, imagMin = Infinity, imagMax = -Infinity;
        allCoords.forEach(p => {
            if (p.real < realMin) realMin = p.real;
            if (p.real > realMax) realMax = p.real;
            if (p.imag < imagMin) imagMin = p.imag;
            if (p.imag > imagMax) imagMax = p.imag;
        });
        const margin = 0.25;
        const realRange = realMax - realMin || 1;
        const imagRange = imagMax - imagMin || 1;
        const range = Math.max(realRange, imagRange) * (1 + 2*margin);
        const centerReal = (realMin + realMax) / 2;
        const centerImag = (imagMin + imagMax) / 2;
        const xMin = centerReal - range/2, xMax = centerReal + range/2;
        const yMin = centerImag - range/2, yMax = centerImag + range/2;

        const pad = { t: 40, r: 40, b: 40, l: 60 };
        const mapX = (x) => pad.l + (x - xMin) / (xMax - xMin) * (w - pad.l - pad.r);
        const mapY = (y) => h - pad.b - (y - yMin) / (yMax - yMin) * (h - pad.t - pad.b);

        // 网格 & 坐标轴
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5;
        ctx.save();
        ctx.setLineDash([3,3]); ctx.strokeStyle = '#ccc'; ctx.lineWidth = 0.5;
        const x0 = mapX(0), y0 = mapY(0);
        ctx.beginPath(); ctx.moveTo(pad.l, y0); ctx.lineTo(w - pad.r, y0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0, pad.t); ctx.lineTo(x0, h - pad.b); ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#333'; ctx.font = "10px Arial";
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('实轴', w - pad.r, y0 + 4);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('虚轴', x0 - 8, pad.t + 4);

        // 散点轨迹
        ctx.fillStyle = 'rgba(120,120,120,0.35)';
        allPoints.forEach(p => {
            const px = mapX(p.real), py = mapY(p.imag);
            if (px >= pad.l && px <= w - pad.r && py >= pad.t && py <= h - pad.b) {
                ctx.beginPath(); ctx.arc(px, py, 1, 0, 2*Math.PI); ctx.fill();
            }
        });

        // 开环极点
        ctx.strokeStyle = '#D32F2F'; ctx.lineWidth = 2;
        poles.forEach(p => {
            const re = math.re(p), im = math.im(p);
            const px = mapX(re), py = mapY(im);
            const s = 6;
            ctx.beginPath();
            ctx.moveTo(px-s, py-s); ctx.lineTo(px+s, py+s);
            ctx.moveTo(px-s, py+s); ctx.lineTo(px+s, py-s);
            ctx.stroke();
            if (showCoords) {
                const label = `(${toSci(re)}, ${toSci(im)})`;
                ctx.font = "10px Consolas";
                ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                const tw = ctx.measureText(label).width;
                const tx = px + 8, ty = py - 8;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(tx - 2, ty - 14, tw + 4, 16);
                ctx.fillStyle = '#D32F2F';
                ctx.fillText(label, tx, ty);
            }
        });

        // 开环零点
        ctx.strokeStyle = '#2E7D32'; ctx.lineWidth = 2;
        zeros.forEach(z => {
            const re = math.re(z), im = math.im(z);
            const px = mapX(re), py = mapY(im);
            ctx.beginPath(); ctx.arc(px, py, 6, 0, 2*Math.PI); ctx.stroke();
            if (showCoords) {
                const label = `(${toSci(re)}, ${toSci(im)})`;
                ctx.font = "10px Consolas";
                ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                const tw = ctx.measureText(label).width;
                const tx = px + 8, ty = py - 8;
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(tx - 2, ty - 14, tw + 4, 16);
                ctx.fillStyle = '#2E7D32';
                ctx.fillText(label, tx, ty);
            }
        });

        // 当前闭环极点 (红点)
        if (currentRoots.length > 0) {
            ctx.fillStyle = '#D32F2F';
            ctx.shadowColor = 'rgba(211,47,47,0.5)';
            ctx.shadowBlur = 10;
            currentRoots.forEach(r => {
                const re = math.re(r), im = math.im(r);
                const px = mapX(re), py = mapY(im);
                if (px >= pad.l && px <= w - pad.r && py >= pad.t && py <= h - pad.b) {
                    ctx.beginPath(); ctx.arc(px, py, 5, 0, 2*Math.PI); ctx.fill();
                    if (showCoords) {
                        ctx.shadowBlur = 0;
                        const label = `(${toSci(re)}, ${toSci(im)})`;
                        ctx.font = "10px Consolas";
                        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                        const tw = ctx.measureText(label).width;
                        const tx = px + 8, ty = py - 8;
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.fillRect(tx - 2, ty - 14, tw + 4, 16);
                        ctx.fillStyle = '#D32F2F';
                        ctx.fillText(label, tx, ty);
                    }
                }
            });
            ctx.shadowBlur = 0;
        }

        // 图例 (右下)
        const legendX = w - pad.r - 10, legendY = h - pad.b - 10;
        const lines = [
            { text: '× 开环极点', color: '#D32F2F' },
            { text: '○ 开环零点', color: '#2E7D32' },
            { text: '● 当前β闭环极点', color: '#D32F2F' },
            { text: `β = ${beta.toFixed(2)}`, color: '#555' }
        ];
        if (hasInfinite) lines.push({ text: '(部分极点趋于无穷)', color: '#888' });
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        let yPos = legendY;
        lines.slice().reverse().forEach(item => {
            ctx.fillStyle = item.color;
            ctx.font = "10px Arial";
            ctx.fillText(item.text, legendX, yPos);
            yPos -= 16;
        });
    }

    // ===================================================================
    // 主渲染循环
    // ===================================================================
    function render() {
        const dpr = window.devicePixelRatio || 1;
        const w = mCanvas.width / dpr, h = mCanvas.height / dpr;
        const mRange = { min: parseFloat(document.getElementById('mag-min').value), max: parseFloat(document.getElementById('mag-max').value) };
        const pRange = { min: parseFloat(document.getElementById('phase-min').value), max: parseFloat(document.getElementById('phase-max').value) };

        [mCtx, pCtx].forEach(ctx => {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            drawGrid(ctx, w, h, ctx === mCtx ? mRange : pRange, ctx === mCtx ? 'dB' : '°');
        });

        let ugf = null, pm = null;
        mCtx.beginPath(); pCtx.beginPath();
        mCtx.strokeStyle = "#1976D2"; pCtx.strokeStyle = "#E65100";
        mCtx.lineWidth = 2.5;

        for (let x = PAD.l; x <= w - PAD.r; x++) {
            const f = xToFreq(x, w);
            const { m, p } = getResp(f);
            const my = valToY(m, mRange.min, mRange.max, h);
            const py = valToY(p, pRange.min, pRange.max, h);
            if (x === PAD.l) { mCtx.moveTo(x, my); pCtx.moveTo(x, py); }
            else { mCtx.lineTo(x, my); pCtx.lineTo(x, py); }
            if (!ugf && m <= 0) { ugf = f; pm = p; }
        }
        mCtx.stroke(); pCtx.stroke();

        if (ugf && ugf >= view.fMin && ugf <= view.fMax) {
            const ux = freqToX(ugf, w);
            [mCtx, pCtx].forEach(ctx => {
                ctx.save();
                ctx.setLineDash([5,3]);
                ctx.strokeStyle = COLORS.ugf; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(ux, PAD.t); ctx.lineTo(ux, h - PAD.b); ctx.stroke();
                if (ctx === mCtx) {
                    ctx.fillStyle = COLORS.ugf;
                    ctx.font = "bold 11px Arial";
                    ctx.fillText(`UGF: ${formatEng(ugf)}Hz`, ux + 5, PAD.t + 15);
                }
                ctx.restore();
            });
        }

        drawProbe(w, h, mRange, pRange);

        [...sys.poles.map(p=>({p, isP:true})), ...sys.zeros.map(z=>({p:z, isP:false}))].forEach(obj => {
            drawMarker(mCtx, obj.p, obj.isP, mRange, w, h);
        });

        document.getElementById('ugf-val').innerText = ugf ? formatEng(ugf) + 'Hz' : '--';
        document.getElementById('pm-val').innerText = pm ? pm.toFixed(1) + '°' : '--';

        drawRootLocus();
    }

    // ===================================================================
    // 交互事件 & UI 同步
    // ===================================================================
    let dragTarget = null;
    function setupEvents() {
        const handleDown = (e) => {
            const canvas = e.target;
            const r = canvas.getBoundingClientRect();
            const mx = e.clientX - r.left, my = e.clientY - r.top;
            const px = freqToX(sys.probeFreq, r.width);
            if (Math.abs(mx - px) < 15) { dragTarget = { type: 'probe' }; return; }
            if (canvas === mCanvas) {
                const mRange = { min: parseFloat(document.getElementById('mag-min').value), max: parseFloat(document.getElementById('mag-max').value) };
                [...sys.poles.map((p,i)=>({p,i,t:'pole'})), ...sys.zeros.map((z,i)=>({p:z,i,t:'zero'}))].forEach(o => {
                    const ix = freqToX(o.p.f, r.width), iy = valToY(getResp(o.p.f).m, mRange.min, mRange.max, r.height);
                    if (Math.hypot(mx-ix, my-iy) < 25) dragTarget = o;
                });
            }
        };
        const handleMove = (e) => {
            if (!dragTarget) return;
            const r = mCanvas.getBoundingClientRect();
            let x = Math.max(PAD.l, Math.min(e.clientX - r.left, r.width - PAD.r));
            const newF = xToFreq(x, r.width);
            if (dragTarget.type === 'probe') sys.probeFreq = newF;
            else dragTarget.p.f = newF;
            render(); syncUI();
        };
        const handleUp = () => { dragTarget = null; };
        [mCanvas, pCanvas].forEach(c => {
            c.addEventListener('mousedown', handleDown);
            c.addEventListener('mousemove', handleMove);
        });
        window.addEventListener('mouseup', handleUp);
        // 触摸支持
        [mCanvas, pCanvas].forEach(c => {
            c.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.touches[0];
                c.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
            }, { passive: false });
            c.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0];
                c.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
            }, { passive: false });
            c.addEventListener('touchend', e => {
                e.preventDefault();
                window.dispatchEvent(new MouseEvent('mouseup'));
            }, { passive: false });
        });
    }

    function syncUI() {
        const renderList = (type) => {
            const container = document.getElementById(type + 's-list');
            container.innerHTML = '';
            sys[type+'s'].forEach((item, i) => {
                const row = document.createElement('div'); row.className = 'item-row';
                const opts = (type === 'pole') ?
                    `<option value="LHP" ${item.t==='LHP'?'selected':''}>LHP</option><option value="RHP" ${item.t==='RHP'?'selected':''}>RHP</option><option value="Conjugate" ${item.t==='Conjugate'?'selected':''}>Conj</option>` :
                    `<option value="LHP" ${item.t==='LHP'?'selected':''}>LHP</option><option value="RHP" ${item.t==='RHP'?'selected':''}>RHP</option><option value="Conjugate" ${item.t==='Conjugate'?'selected':''}>Conj</option>`;
                let qExtra = '';
                if (item.t === 'Conjugate') {
                    qExtra = `<div class="q-input"><label>Q</label><input type="number" step="0.05" value="${item.q||0.707}" onchange="updateItem('${type}',${i},'q',this.value)"></div>`;
                }
                // 恢复原始删除按钮样式（内联）
                row.innerHTML = `
                    <input type="text" value="${formatEng(item.f)}" onchange="updateItem('${type}',${i},'f',this.value)">
                    <select onchange="updateItem('${type}',${i},'t',this.value)">${opts}</select>
                    <input type="color" value="${item.c}" onchange="updateItem('${type}',${i},'c',this.value)">
                    <button style="border:none;background:none;color:red;font-weight:bold;cursor:pointer;font-size:16px;line-height:1;" onclick="removeItem('${type}',${i})">×</button>
                    <div></div>
                    ${qExtra}
                `;
                container.appendChild(row);
            });
        };
        renderList('pole');
        renderList('zero');
    }

    function updateView() {
        const pan = parseFloat(document.getElementById('freq-pan').value);
        const zoom = parseFloat(document.getElementById('freq-zoom').value);
        view.fMin = Math.pow(10, pan - zoom/2);
        view.fMax = Math.pow(10, pan + zoom/2);
        render();
    }

    function updateBeta() {
        const slider = document.getElementById('beta-slider');
        currentBeta = parseFloat(slider.value);
        document.getElementById('beta-display').textContent = currentBeta.toFixed(2);
        render();
    }

    function updateBetaMax() {
        let val = parseFloat(document.getElementById('beta-max').value);
        if (isNaN(val) || val < 0) val = 1;
        betaMax = val;
        const slider = document.getElementById('beta-slider');
        slider.max = betaMax;
        if (parseFloat(slider.value) > betaMax) {
            slider.value = betaMax;
            currentBeta = betaMax;
            document.getElementById('beta-display').textContent = currentBeta.toFixed(2);
        }
        render();
    }

    // 暴露全局
    window.addItem = (t) => {
        sys[t+'s'].push({f: 1e6, t:'LHP', c: t==='pole'?'#D32F2F':'#2E7D32', q: 0.707});
        syncUI(); render();
    };
    window.removeItem = (t, i) => {
        sys[t+'s'].splice(i, 1);
        syncUI(); render();
    };
    window.updateItem = (t, i, fld, val) => {
        if (fld === 'f') sys[t+'s'][i].f = parseEng(val);
        else if (fld === 'q') sys[t+'s'][i].q = parseFloat(val) || 0.707;
        else if (fld === 't') { sys[t+'s'][i].t = val; if (val === 'Conjugate' && !sys[t+'s'][i].q) sys[t+'s'][i].q = 0.707; }
        else if (fld === 'c') sys[t+'s'][i].c = val;
        render(); syncUI();
    };
    window.updateSys = () => {
        sys.dc = parseEng(document.getElementById('dc-gain').value);
        render();
    };
    window.updateBeta = updateBeta;
    window.updateBetaMax = updateBetaMax;

    // ===================================================================
    // 初始化
    // ===================================================================
    function init() {
        window.addEventListener('resize', onResize);
        setupEvents();
        updateView();
        syncUI();
        document.getElementById('beta-slider').max = betaMax;
        document.getElementById('beta-slider').value = currentBeta;
        document.getElementById('beta-display').textContent = currentBeta.toFixed(2);
        document.getElementById('show-coords').checked = false;
        setTimeout(onResize, 50);
    }

    function onResize() {
        const containerWidth = mCanvas.parentElement.clientWidth;
        const fixedHeight = 320;
        const dpr = window.devicePixelRatio || 1;
        [mCanvas, pCanvas, rlCanvas].forEach(c => {
            c.width = containerWidth * dpr;
            c.height = fixedHeight * dpr;
            c.style.height = fixedHeight + 'px';
        });
        render();
    }

    init();
</script>
</body>
